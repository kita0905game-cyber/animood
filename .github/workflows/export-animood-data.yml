name: Export AniMood data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'
permissions:
  contents: write
concurrency:
  group: animood-data-export
  cancel-in-progress: false
jobs:
  export:
    # Enable the repository variable only after a successful manual run.
    if: github.event_name == 'workflow_dispatch' || vars.ANIMOOD_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exporter and matching
        run: node --test tests/v05.test.mjs
      - name: Export public data
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        run: node scripts/export-airtable.mjs
      - name: Build public site
        run: python3 tools/build_site.py
      - name: Commit data only when changed
        run: |
          if git diff --quiet -- data/anime.json; then exit 0; fi
          git config user.name 'animood-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/anime.json
          git commit -m 'data: refresh public anime catalog'
          git push
